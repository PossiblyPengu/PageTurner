name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # the release workflow runs it for the version commit it makes (a push made with the workflow's own token
  # starts nothing), and the site deploys when CI goes green
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-logic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2.1"
      - name: Native pure-logic regression checks
        run: ios/Checks/bookmaster/run.sh data

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Version in sync (PWA + iOS)
        run: npm run version:check

      - name: Test
        run: npm test
