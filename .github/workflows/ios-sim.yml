name: iOS Simulator

# Runs the app for the first time anywhere: a Debug build in the iOS Simulator,
# launched once per screen with sample books, photographed. The screenshots are
# the only way to look at the UI without a Mac — read them from the artifact.
on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios-sim.yml"
      - ".github/actions/ios-env/**"

concurrency:
  group: ios-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screens:
    name: screens (${{ matrix.set }})
    runs-on: macos-15
    timeout-minutes: 60
    # two machines at once: the voices half (a voice download, read-aloud on the page) is the slow part
    strategy:
      fail-fast: false
      matrix:
        set: [screens, voices]
    steps:
      - uses: actions/checkout@v4

      - name: iOS build environment
        uses: ./.github/actions/ios-env

      - name: Create a simulator
        id: sim
        run: |
          xcrun simctl list runtimes
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import sys, json
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS")]
          rs.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          print(rs[-1]["identifier"] if rs else "")
          ')
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c '
          import sys, json
          ts = [t for t in json.load(sys.stdin)["devicetypes"] if t["name"].startswith("iPhone")]
          names = {t["name"]: t["identifier"] for t in ts}
          for want in ["iPhone 17 Pro", "iPhone 16 Pro", "iPhone 15 Pro"]:
              if want in names:
                  print(names[want]); break
          else:
              print(ts[-1]["identifier"] if ts else "")
          ')
          echo "runtime: $RUNTIME  type: $TYPE"
          UDID=$(xcrun simctl create PT-Test "$TYPE" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for the simulator (Debug)
        run: |
          set -o pipefail
          cd ios
          xcodebuild \
            -project Pageturner.xcodeproj \
            -scheme Pageturner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-sim \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild-sim.log

      - name: Report compiler diagnostics
        if: always()
        run: |
          cd ios
          { echo "### Swift diagnostics (simulator build)"; echo '```';
            grep -E "(error|warning): " xcodebuild-sim.log | sort -u | head -60 || true;
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -E "error: " xcodebuild-sim.log | sort -u | head -40 || true

      - name: Run and photograph every screen
        run: |
          mkdir -p shots
          bash ios/scripts/simulator-shots.sh "${{ steps.sim.outputs.udid }}" \
            "$PWD/ios/build-sim/Build/Products/Debug-iphonesimulator/Pageturner.app" "$PWD/shots" "${{ matrix.set }}"

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screens-${{ matrix.set }}
          path: shots
          if-no-files-found: ignore
