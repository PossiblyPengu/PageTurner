name: Deploy to Cloudflare Pages

# Deploys happen when CI goes green on main — never before. A commit that
# fails lint/tests/version-check used to ship anyway because this ran on
# every push in parallel with CI. To redeploy without a push (e.g. to bind a
# rotated secret), run wrangler locally: wrangler pages deploy docs --branch main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Secrets can't sit in `if`, so the check reads an env var: no token means a
      # skipped deploy with a loud note rather than a red run.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.0"
          command: pages deploy docs --project-name=pageturner --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Note the skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "CLOUDFLARE_API_TOKEN isn't set — deploy manually: wrangler pages deploy docs --project-name=pageturner" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
