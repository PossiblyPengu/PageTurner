name: iOS IPA

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - ".github/workflows/ios-build.yml"
      - ".github/actions/ios-env/**"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/ios-build.yml
    secrets: inherit

  # Every green build on main becomes the rolling `ios-latest` release (Pageturner.ipa and an AltStore / SideStore
  # source whose links never change), so a source added once to SideStore offers each build as an update.
  publish:
    needs: build
    concurrency:
      group: ios-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the IPA
        uses: actions/download-artifact@v4
        with:
          name: Pageturner-ipa
          path: out

      - name: Publish build and update rolling links
        run: bash ios/scripts/publish-release.sh out "$GITHUB_SHA" "$GITHUB_RUN_ID"
