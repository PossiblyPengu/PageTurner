# XcodeGen spec — the Xcode project is generated from this, not committed.
#   brew install xcodegen && xcodegen generate
# CI (.github/workflows/ios.yml) does the same and builds an unsigned IPA.
name: Pageturner
options:
  bundleIdPrefix: io.github.possiblypengu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.11.0
  # Readium's own fork (module: ReadiumZIPFoundation) — already in the
  # dependency graph through swift-toolkit, so the backup code reuses it.
  ZIPFoundation:
    url: https://github.com/readium/ZIPFoundation.git
    exactVersion: 3.0.1
  # On-device neural text-to-speech (Piper voices on ONNX Runtime): the package's own
  # prebuilt xcframeworks. Its Swift wrapper is the `SherpaOnnx` module.
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 1.13.8
targets:
  Pageturner:
    type: application
    platform: iOS
    sources:
      - path: Pageturner
        excludes:
          - Info.plist
      # espeak-ng's phoneme data, which the neural voices need to turn text into sounds
      # (a folder reference: copied into the app as it is)
      - path: Resources/espeak-ng-data
        type: folder
      # the rustle of a page turning (Reader/PageTurnSound.swift)
      - path: Resources/Sounds
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: ZIPFoundation
        product: ReadiumZIPFoundation
      - package: SherpaOnnx
        product: sherpa-onnx
    info:
      path: Pageturner/Info.plist
      properties:
        CFBundleDisplayName: Pageturner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # online catalogues: a Calibre server on the home network speaks plain http
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Pageturner connects to a book catalogue on your network when you add one.
        # the camera reads a cover's barcode to find the book on BookMaster
        NSCameraUsageDescription: Pageturner uses the camera to scan a book's barcode when adding it to BookMaster.
        # BookMaster's pair flow comes home as pageturner://link?code=…
        CFBundleURLTypes:
          - CFBundleURLName: io.github.possiblypengu.pageturner
            CFBundleURLSchemes:
              - pageturner
        # read-aloud keeps playing with the screen locked; "fetch" lets iOS wake
        # the app now and then to look for new BookMaster suggestions; "processing"
        # lets the scheduled library backup run overnight while charging
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.possiblypengu.pageturner.refresh
          - io.github.possiblypengu.pageturner.backup
        # the Books folder is visible in the Files app
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: Audiobook
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
          - CFBundleTypeName: Comic Book Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - io.github.possiblypengu.pageturner.cbz
          - CFBundleTypeName: Text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
          - CFBundleTypeName: Markdown
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
          - CFBundleTypeName: HTML
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.html
        # CBZ and Markdown have no system type on every iOS — declare them so
        # "Open in Pageturner" is offered for those files
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.github.possiblypengu.pageturner.cbz
            UTTypeDescription: Comic Book Archive
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - cbz
              public.mime-type:
                - application/vnd.comicbook+zip
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.possiblypengu.pageturner
        MARKETING_VERSION: "2.14.0"
        CURRENT_PROJECT_VERSION: "92"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Pageturner:
    build:
      targets:
        Pageturner: all
